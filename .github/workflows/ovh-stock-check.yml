name: OVH VPS Stock Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check availability
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAN_CODE: vps-2027-model1
          SUBSIDIARY: WE
        run: |
          RESPONSE=$(curl -s "https://eu.api.ovh.com/1.0/vps/order/rule/datacenter?ovhSubsidiary=${SUBSIDIARY}&planCode=${PLAN_CODE}")
          echo "$RESPONSE"
          AVAILABLE=$(echo "$RESPONSE" | jq -r '[.datacenters[]? | select(.linuxStatus == "available" or .status == "available") | .datacenter] | join(", ")')
          if true; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="✅ ${PLAN_CODE} متاح الآن في: ${AVAILABLE}
          https://www.ovhcloud.com/en/vps/configurator/?planCode=${PLAN_CODE}"
          fi
