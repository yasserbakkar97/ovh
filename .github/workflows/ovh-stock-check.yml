name: OVH VPS Stock Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check availability
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAN_CODES: "vps-2027-model1 vps-2027-model2"
          SUBSIDIARY: IE
        run: |
          MESSAGE=""
          for PLAN in $PLAN_CODES; do
            RESPONSE=$(curl -s "https://eu.api.ovh.com/1.0/vps/order/rule/datacenter?ovhSubsidiary=${SUBSIDIARY}&planCode=${PLAN}")
            echo "${PLAN}: ${RESPONSE}"
            AVAILABLE=$(echo "$RESPONSE" | jq -r '[.datacenters[]? | select(.status == "available" and (.code | startswith("eu-"))) | .datacenter] | join(", ")')
            if [ -n "$AVAILABLE" ]; then
              MESSAGE+="✅ ${PLAN} متاح الآن في: ${AVAILABLE}"$'\n'"https://www.ovhcloud.com/en/vps/configurator/?planCode=${PLAN}"$'\n\n'
            fi
          done
          if [ -n "$MESSAGE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MESSAGE}"
          fi
